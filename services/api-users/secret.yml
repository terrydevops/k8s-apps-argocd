# Replace these with your own Azure Cosmos DB connection values before applying.
# In production prefer SealedSecrets or external-secrets-operator over a
# committed Secret manifest.
apiVersion: v1
kind: Secret
metadata:
  name: cosmos-db-secret
  namespace: asset
type: Opaque
stringData:
  database: "REPLACE_ME"
  key: "REPLACE_ME"
  uri: "https://your-cosmos-account.documents.azure.com:443/"

