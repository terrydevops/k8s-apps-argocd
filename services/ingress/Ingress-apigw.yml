apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apigw-ingress
  namespace: asset
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # acme.cert-manager.io/http01-edit-in-place: "true"

spec:
  ingressClassName: nginx
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apigw-service
                port:
                  number: 8083
  tls:
    - hosts:
        - api.example.com
      secretName: apigw-ingress-cert-tls